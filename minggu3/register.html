<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Nineteen Studios</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
</script>
</head>
<body class="bg-white text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md">
    <div class="flex justify-center mb-8">
      <img src="assets/logo.png" alt="Nineteen Studios" class="h-9">
    </div>

    <div class="border border-slate-100 rounded-2xl p-8 shadow-sm shadow-slate-100">
      <h1 class="text-lg font-semibold text-slate-800 mb-1">Daftar Akun</h1>
      <p class="text-xs text-slate-400 mb-6">Lengkapi data berikut untuk membuat akun.</p>

      <form id="registerForm" action="dashboard.html" novalidate class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Minimal 3 karakter"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
          <p id="username-error" class="hidden text-xs text-rose-500 mt-1.5"></p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Minimal 8 karakter"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
          <p id="password-error" class="hidden text-xs text-rose-500 mt-1.5"></p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="nama">Nama</label>
          <input id="nama" name="nama" type="text" placeholder="Nama lengkap"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
          <p id="nama-error" class="hidden text-xs text-rose-500 mt-1.5"></p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="tanggal_lahir">Tanggal Lahir</label>
          <input id="tanggal_lahir" name="tanggal_lahir" type="date"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
          <p id="tanggal_lahir-error" class="hidden text-xs text-rose-500 mt-1.5"></p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="alamat">Alamat</label>
          <textarea id="alamat" name="alamat" rows="3" placeholder="Alamat lengkap"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400"></textarea>
          <p id="alamat-error" class="hidden text-xs text-rose-500 mt-1.5"></p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="telepon">Nomor Telepon</label>
          <input id="telepon" name="telepon" type="tel" placeholder="Contoh: 628123456789"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
          <p id="telepon-error" class="hidden text-xs text-rose-500 mt-1.5"></p>
        </div>

        <button type="submit"
          class="w-full rounded-lg bg-gradient-to-r from-sky-400 to-blue-600 text-white text-sm font-medium py-2.5 hover:opacity-90 transition">
          Daftar
        </button>
      </form>

      <p class="text-center text-xs text-slate-400 mt-6">
        Sudah punya akun? <a href="index.html" class="text-blue-600 font-medium hover:underline">Masuk</a>
      </p>
    </div>

    <p class="text-center text-xs text-slate-300 mt-6">© 2026 Nineteen Studios</p>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>
