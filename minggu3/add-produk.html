<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Produk - Nineteen Studios Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
</script>
</head>
<body class="bg-white text-slate-800 font-sans antialiased">
<div class="flex min-h-screen">

  <aside class="w-64 shrink-0 border-r border-slate-100 flex flex-col justify-between px-6 py-8">
    <div>
      <img src="assets/logo.png" alt="Nineteen Studios" class="h-7 mb-12">
      <nav class="space-y-1 text-sm">
        <a href="dashboard.html" class="block px-3 py-2 rounded-lg font-medium text-slate-500 hover:bg-slate-50">Dashboard</a>
        <a href="products.html" class="block px-3 py-2 rounded-lg font-medium bg-blue-50 text-blue-600">Products</a>
      </nav>
    </div>
    <a href="index.html" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-50 hover:text-slate-600">Logout</a>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 shrink-0 border-b border-slate-100 flex items-center justify-between px-8">
      <p class="text-sm font-medium text-slate-400">Products / Add</p>
      <div class="h-8 w-8 rounded-full bg-gradient-to-br from-sky-400 to-blue-600"></div>
    </header>

    <main class="flex-1 px-8 py-10">
      <h1 class="text-2xl font-semibold text-slate-800 mb-8">Add Produk</h1>

      <form enctype="multipart/form-data" onsubmit="event.preventDefault(); window.location.href='products.html';" class="max-w-lg space-y-5">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="image">Gambar Produk</label>
          <input id="image" type="file" accept="image/*" required
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2 text-sm text-slate-700 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-medium file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="name">Name</label>
          <input id="name" type="text" required placeholder="Contoh: Cetak Banner Outdoor"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="stock">Stock</label>
          <input id="stock" type="number" min="0" required placeholder="0"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5" for="description">Description</label>
          <textarea id="description" rows="4" placeholder="Deskripsi singkat produk atau jasa"
            class="w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit"
            class="rounded-lg bg-gradient-to-r from-sky-400 to-blue-600 text-white text-sm font-medium px-5 py-2.5 hover:opacity-90 transition">
            Submit
          </button>
          <a href="products.html"
            class="rounded-lg border border-slate-200 text-slate-500 text-sm font-medium px-5 py-2.5 hover:bg-slate-50 transition">
            Batal
          </a>
        </div>
      </form>
    </main>

    <footer class="shrink-0 border-t border-slate-100 px-8 py-4">
      <p class="text-xs text-slate-400">© 2026 Nineteen Studios. All rights reserved.</p>
    </footer>
  </div>

</div>
</body>
</html>
