<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Nineteen Studios</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
</script>
</head>
<body class="bg-white text-slate-800 font-sans antialiased">
<div class="flex min-h-screen">

  <aside class="w-64 shrink-0 border-r border-slate-100 flex flex-col justify-between px-6 py-8">
    <div>
      <img src="assets/logo.png" alt="Nineteen Studios" class="h-7 mb-12">
      <nav class="space-y-1 text-sm">
        <a href="dashboard.html" class="block px-3 py-2 rounded-lg font-medium bg-blue-50 text-blue-600">Dashboard</a>
        <a href="products.html" class="block px-3 py-2 rounded-lg font-medium text-slate-500 hover:bg-slate-50">Products</a>
    </div>
    <a href="index.html" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-50 hover:text-slate-600">Logout</a>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 shrink-0 border-b border-slate-100 flex items-center justify-between px-8">
      <p class="text-sm font-medium text-slate-400">Dashboard</p>
      <div class="h-8 w-8 rounded-full bg-gradient-to-br from-sky-400 to-blue-600"></div>
    </header>

    <main class="flex-1 px-8 py-10">
      <h1 class="text-2xl font-semibold text-slate-800 mb-8">Dashboard</h1>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
        <div class="border border-slate-100 border-t-2 border-t-sky-400 rounded-xl p-5">
          <p class="text-xs font-medium text-slate-400 mb-2">Pesanan Bulan Ini</p>
          <p class="text-2xl font-semibold text-slate-800">128</p>
          <p class="text-xs text-emerald-500 mt-2">+12% dari bulan lalu</p>
        </div>
        <div class="border border-slate-100 border-t-2 border-t-blue-500 rounded-xl p-5">
          <p class="text-xs font-medium text-slate-400 mb-2">Pendapatan</p>
          <p class="text-2xl font-semibold text-slate-800">Rp 42,5jt</p>
          <p class="text-xs text-emerald-500 mt-2">+8% dari bulan lalu</p>
        </div>
        <div class="border border-slate-100 border-t-2 border-t-indigo-500 rounded-xl p-5">
          <p class="text-xs font-medium text-slate-400 mb-2">Layanan Aktif</p>
          <p class="text-2xl font-semibold text-slate-800">24</p>
          <p class="text-xs text-slate-400 mt-2">Desain &amp; percetakan</p>
        </div>
        <div class="border border-slate-100 border-t-2 border-t-blue-700 rounded-xl p-5">
          <p class="text-xs font-medium text-slate-400 mb-2">Pelanggan Baru</p>
          <p class="text-2xl font-semibold text-slate-800">15</p>
          <p class="text-xs text-emerald-500 mt-2">+3 minggu ini</p>
        </div>
      </div>
    </main>

    <footer class="shrink-0 border-t border-slate-100 px-8 py-4">
      <p class="text-xs text-slate-400">© 2026 Nineteen Studios. All rights reserved.</p>
    </footer>
  </div>

</div>
</body>
</html>
